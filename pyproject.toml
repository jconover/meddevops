[project]
name = "meddevops"
version = "0.1.0"
description = "Medical device telemetry pipeline on AWS"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "packages/telemetry/tests",
]
