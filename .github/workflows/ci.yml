name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: uv sync --all-packages --frozen

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Test
        run: uv run pytest -v

      - name: CDK synth
        working-directory: infra
        run: npx --yes aws-cdk@2.1142.0 synth -c allowedCidr=203.0.113.10/32 --quiet
