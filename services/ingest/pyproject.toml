[project]
name = "ingest"
version = "0.1.0"
description = "Lambda that validates procedure logs and stores them in Postgres"
requires-python = ">=3.14"
dependencies = [
    "telemetry",
    "psycopg[binary]>=3.3.6",
    "boto3>=1.43.100",
]

[tool.uv.sources]
telemetry = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
