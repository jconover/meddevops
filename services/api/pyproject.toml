[project]
name = "api"
version = "0.1.0"
description = "Read-only REST API over ingested telemetry"
requires-python = ">=3.14"
dependencies = [
    "telemetry",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv.sources]
telemetry = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
